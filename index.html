<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오늘의 스토아</title>
  <meta name="description" content="매일 하나씩 읽는 스토아 철학 명언">
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="오늘의 스토아">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="scroller">
    <section id="today-view" aria-labelledby="today-date">
      <div class="date-row">
        <h1 id="today-date" class="date"></h1>
        <button type="button" id="prev-day" class="day-nav" aria-label="이전 날">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <button type="button" id="next-day" class="day-nav" aria-label="다음 날">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
      <figure class="quote">
        <blockquote id="quote-text"></blockquote>
        <figcaption>
          <span id="quote-author" class="author"></span>
          <span id="quote-source" class="source"></span>
        </figcaption>
      </figure>
      <div class="reflection">
        <h2 id="reflection-title">오늘의 생각거리</h2>
        <p id="quote-reflection"></p>
      </div>
      <p class="note">명언은 공개된 영역본을 우리말로 옮겼고, 생각거리는 원전이 아니라 이 앱에서 덧붙인 질문입니다.</p>
    </section>

    <section id="saved-view" aria-labelledby="saved-title" hidden>
      <h1 id="saved-title" class="date">저장한 명언</h1>
      <p id="saved-empty" class="empty" hidden>아직 저장한 명언이 없습니다.<br>마음에 남는 명언을 만나면 저장해 보세요.</p>
      <ul id="saved-list"></ul>
    </section>
  </main>

  <nav class="bar" aria-label="메뉴">
    <button type="button" id="nav-today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      오늘
    </button>
    <button type="button" id="nav-saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/></svg>
      저장함
    </button>
    <button type="button" id="toggle-save" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 1-1z"/></svg>
      <span id="toggle-save-label">저장</span>
    </button>
    <button type="button" id="font-size">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 9.5 5 15 19M6 14h7M16 13l2.5-5 2.5 5M16.7 11.5h3.6"/></svg>
      <span id="font-size-label">글자 보통</span>
    </button>
  </nav>

  <script src="quotes.js"></script>
  <script src="app.js"></script>
</body>
</html>
